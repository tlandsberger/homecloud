services:
  cloudflared:
    image: cloudflare/cloudflared:2026.11.2
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --metrics 0.0.0.0:60123 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - cloudflare
      - monitoring
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=cloudflared:60123"

networks:
  # Nur cloudflared und Traefik. Festes Subnetz: Traefik übernimmt X-Forwarded-For (echte Besucher-IP von
  # Cloudflare) nur von hier, siehe forwardedHeaders im Eingang „cloudflare“ (infrastructure/traefik).
  cloudflare:
    name: cloudflare
    ipam:
      config:
        - subnet: 10.250.0.0/24
  monitoring:
    external: true
    name: monitoring_monitoring
