# Vereinsportal „Wedeler TSV Judo“ (https://github.com/tlandsberger/judo-portal, docs/betrieb.md)
# Ein Container: Django mit eingebauter Anmeldung und SQLite im Volume /data (inkl. nächtlicher Backups).
# Öffentlich unter https://judo.tlandsberger.de (Cloudflare-Access-Bypass, siehe README).
services:
  judo_portal:
    image: ghcr.io/tlandsberger/judo-portal:0.3.0
    container_name: judo_portal
    restart: unless-stopped
    environment:
      - PORTAL_SECRET_KEY=${JUDO_SECRET_KEY}
      - PORTAL_BASE_URL=https://judo.tlandsberger.de
      - PORTAL_ALLOWED_HOSTS=judo.tlandsberger.de
      - PORTAL_INITIAL_ADMIN_EMAIL=${JUDO_INITIAL_ADMIN_EMAIL}
      - PORTAL_EMAIL_HOST=smtp.ionos.de
      - PORTAL_EMAIL_PORT=587
      - PORTAL_EMAIL_USER=${JUDO_EMAIL_USER}
      - PORTAL_EMAIL_PASSWORD=${JUDO_EMAIL_PASSWORD}
      - PORTAL_EMAIL_FROM=Wedeler TSV Judo <${JUDO_EMAIL_USER}>
      # Push-Benachrichtigungen; leer = alles per Mail
      - PORTAL_VAPID_PUBLIC_KEY=${JUDO_VAPID_PUBLIC_KEY:-}
      - PORTAL_VAPID_PRIVATE_KEY=${JUDO_VAPID_PRIVATE_KEY:-}
      - TZ=Europe/Berlin
    volumes:
      - judo_portal_data:/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.judo.rule=Host(`judo.tlandsberger.de`)"
      - "traefik.http.routers.judo.entrypoints=websecure,cloudflare"
      - "traefik.http.routers.judo.tls.certresolver=letsencrypt"
      - "traefik.http.services.judo.loadbalancer.server.port=8000"
      - "traefik.docker.network=proxy"

volumes:
  judo_portal_data:

networks:
  proxy:
    external: true
    name: proxy
